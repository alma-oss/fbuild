name: Tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron:  '0 3 * * *'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: ubuntu-latest
            run: ./build.sh
    runs-on: ${{ matrix.os.name }}

    env:
      PRIVATE_FEED_USER: ${{ github.repository_owner }}
      PRIVATE_FEED_PASS: ${{ secrets.GITHUB_TOKEN }}
      DOTNET_ROLL_FORWARD: latestMajor

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      # The SAFE fixture's Bundle target runs npm install and vite build.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint, unit tests and integration matrix
        run: ${{ matrix.os.run }} -t Tests
