name: Tests

on:
  #push:
  pull_request:
  schedule:
      -   cron:  '0 3 * * *'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: ubuntu-latest
            run: ./build.sh
    runs-on: ${{ matrix.os.name }}

    env:
      PRIVATE_FEED_USER: ${{ github.repository_owner }}
      PRIVATE_FEED_PASS: ${{ secrets.GITHUB_TOKEN }}
      DOTNET_ROLL_FORWARD: latestMajor

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      # The SAFE fixture's Bundle target runs npm install and vite build.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint and unit tests
        if: github.event_name == 'pull_request'
        run: |
          ${{ matrix.os.run }} -t Lint
          dotnet run --project tests/unit/unit.fsproj --

      # The integration matrix runs a full target graph per spec case — minutes of work, and
      # dependent on npm and the NuGet feeds, so it runs nightly instead of on every pull request.
      - name: Lint, unit tests and integration matrix
        if: github.event_name != 'pull_request'
        run: ${{ matrix.os.run }} -t Tests
